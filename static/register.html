<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sistema de Autenticación</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <section id="register-section">
            <h1>CREAR CUENTA</h1>
            <input type="text" id="reg-user" placeholder="Usuario" required>
            <input type="password" id="reg-pass" placeholder="Contraseña" required>
            <input type="password" id="reg-pass-confirm" placeholder="Confirmar Contraseña" required>
            <button onclick="handleRegister()">REGISTRARSE</button>
            <p>¿Ya tienes cuenta? <a href="/static/login.html">Inicia Sesión</a></p>
        </section>
    </div>
    <script src="/static/auth-logic.js"></script>
</body>
</html>
