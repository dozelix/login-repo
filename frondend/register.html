<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <section id="register-section">
            <h2>Registrarse</h2>
            <input type="text" id="reg-user" placeholder="Nuevo Usuario" required>
            <input type="password" id="reg-pass" placeholder="Nueva Contraseña" required>
            <input type="password" id="reg-pass-confirm" placeholder="Confirmar Contraseña" required>
            <button onclick="handleRegister()">Crear Cuenta</button>
            <p><a href="login.html">Ir al Login</a></p>
        </section>
    </div>
    <script src="auth-logic.js"></script>
</body>
</html>
